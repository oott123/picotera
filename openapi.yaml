paths:
  /api/picotera/admin/overview/distribution:
    get:
      operationId: getAdminOverviewDistribution
      parameters:
        - explode: false
          in: query
          name: range
          required: true
          schema:
            enum:
              - 1d
              - 7d
              - 1m
              - custom
            type: string
        - explode: false
          in: query
          name: startAt
          schema:
            type: string
        - explode: false
          in: query
          name: endAt
          schema:
            type: string
        - explode: false
          in: query
          name: userId
          schema:
            format: int32
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: model
          schema:
            minLength: 1
            type: string
        - explode: false
          in: query
          name: upstreamModel
          schema:
            minLength: 1
            type: string
        - explode: false
          in: query
          name: providerId
          schema:
            format: int32
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: dimension
          required: true
          schema:
            enum:
              - user
              - model
              - upstreamModel
              - provider
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewDistributionView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicoTeraError"
